<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wiki-Joker Pro 4.0</title>
    
    <script src="data.js"></script>

    <style>
        :root { --accent: #00d4ff; --secondary: #ff0055; --smart: #00ff88; }
        body {
            margin: 0; height: 100vh; display: flex; justify-content: center; align-items: center;
            background: #05000a no-repeat center center; background-size: cover;
            transition: 0.8s; font-family: 'Segoe UI', sans-serif; color: #fff;
        }
        .card {
            background: rgba(0, 0, 0, 0.92); backdrop-filter: blur(20px);
            border: 1px solid var(--accent); border-radius: 25px; padding: 35px;
            width: 90%; max-width: 500px; text-align: center; box-shadow: 0 15px 50px rgba(0,0,0,0.9);
        }
        input {
            width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2);
            border-radius: 12px; padding: 15px; color: #fff; font-size: 18px; margin-bottom: 20px;
            outline: none; text-align: center; box-sizing: border-box;
        }
        .btn-group { display: flex; gap: 10px; }
        button {
            flex: 1; padding: 14px; border-radius: 10px; border: none; cursor: pointer;
            font-weight: bold; font-size: 11px; text-transform: uppercase; transition: 0.3s;
        }
        .btn-smart { background: var(--smart); color: #000; }
        .btn-fact { background: var(--secondary); color: #fff; }
        .btn-joke { background: var(--accent); color: #000; }
        
        #output { 
            margin-top: 25px; font-size: 16px; min-height: 150px; max-height: 300px;
            overflow-y: auto; line-height: 1.6; font-weight: 300; 
            border-top: 1px solid rgba(255,255,255,0.1); padding-top: 20px;
            text-align: left; scrollbar-width: thin;
        }
        .loading { color: var(--smart); font-style: italic; text-align: center; width: 100%; }
    </style>
</head>
<body>

    <div class="card">
        <input type="text" id="topic" placeholder="Введи что угодно (напр. Гравитация)">
        <div class="btn-group">
            <button class="btn-smart" onclick="getWiki()">Суть (Wiki)</button>
            <button class="btn-fact" onclick="getFallback('fact')">Факт</button>
            <button class="btn-joke" onclick="getFallback('joke')">Шутка</button>
        </div>
        <div id="output">Готов бороздить просторы интернета...</div>
    </div>

    <script>
        // Небольшой список для конкретных слов
        const localBrain = {
            "машина": {
                fact: "В 1900 году 38% всех автомобилей в США были электрическими.",
                joke: "Стук в двигателе — это способ машины сказать, что ей нужен новый владелец."
            },
            "космос": {
                fact: "Если два куска одного металла соприкоснутся в космосе, они спаяются навсегда.",
                joke: "Космос бесконечен. Как и мои попытки выспаться."
            }
        };

        async function getWiki() {
            const word = document.getElementById('topic').value.trim();
            const out = document.getElementById('output');
            if (!word) { out.innerText = "Напиши слово!"; return; }
            out.innerHTML = '<div class="loading">Запрашиваю мозг Википедии...</div>';
            const url = `https://ru.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(word)}`;
            try {
                const response = await fetch(url);
                const data = await response.json();
                if (data.extract) {
                    out.innerHTML = `<strong>ВЗГЛЯД ЭНЦИКЛОПЕДИИ:</strong><br>${data.extract}`;
                } else {
                    out.innerText = "Википедия в шоке. Попробуй что-то попроще.";
                }
            } catch (error) {
                out.innerText = "Ошибка связи. Интернет устал.";
            }
            updateBg();
        }

        // ОБНОВЛЕННАЯ ФУНКЦИЯ: Работает и с твоим файлом data.js
        function getFallback(type) {
            const word = document.getElementById('topic').value.toLowerCase().trim();
            const out = document.getElementById('output');

            if (!word) { out.innerText = "Сначала слово!"; return; }

            // 1. Проверяем, есть ли слово в ручном списке localBrain
            if (localBrain[word]) {
                out.innerHTML = `<strong>ИНТЕРЕСНО:</strong><br>${localBrain[word][type]}`;
            } 
            // 2. Если нажали "Факт" и слова нет в списке — берем из data.js (myJokesLibrary)
            else if (type === 'fact' && typeof myJokesLibrary !== 'undefined') {
                const randomIndex = Math.floor(Math.random() * myJokesLibrary.length);
                let template = myJokesLibrary[randomIndex];
                out.innerHTML = `<strong>СЕКРЕТНЫЙ ФАКТ:</strong><br>${template.replace('${word}', word)}`;
            }
            // 3. Если ничего не подошло — выдаем стандартную заглушку
            else {
                const templates = {
                    joke: `Про "${word}" пока нет шуток, но звучит иронично!`,
                    fact: `Секретный факт: когда ты гуглишь "${word}", где-то в мире улыбается один программист.`
                };
                out.innerHTML = templates[type];
            }
            updateBg();
        }

        function updateBg() {
            const id = Math.floor(Math.random() * 1000);
            document.body.style.backgroundImage = `url('https://picsum.photos/1920/1080?random=${id}')`;
        }
    </script>
</body>
</html>
