<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои Проекты</title>
    <style>
        body {
            background: #0b0d17; /* Темный космический фон */
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 30px;
            text-shadow: 0 0 15px #00d4ff;
        }
        .container {
            display: flex;
            gap: 25px;
        }
        .card {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-decoration: none;
            color: white;
            transition: all 0.3s ease;
            width: 200px;
        }
        .card:hover {
            transform: translateY(-10px);
            background: rgba(0, 212, 255, 0.2);
            border-color: #00d4ff;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.4);
        }
        .icon {
            font-size: 50px;
            margin-bottom: 15px;
            display: block;
        }
        .title {
            font-size: 1.5rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>Пульт Управления</h1>
    
    <div class="container">
        <a href="space.html" class="card">
            <span class="icon">🚀</span>
            <span class="title">Космос</span>
        </a>

        <a href="Joker.html" class="card">
            <span class="icon">🤡</span>
            <span class="title">Шутки</span>
        </a>
    </div>

</body>
</html>
