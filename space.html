<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>ZenSpace Pro: Точный Атлас</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Segoe UI', sans-serif; color: white; }
        #labels { position: absolute; top: 0; left: 0; pointer-events: none; width: 100%; height: 100%; }
        
        /* Компактная научная инфо-панель */
        #info-panel {
            position: absolute; top: 20px; right: 20px; width: 260px;
            background: rgba(0, 10, 25, 0.95); border: 1px solid #00d4ff;
            border-radius: 12px; padding: 20px; display: none;
            backdrop-filter: blur(15px); box-shadow: 0 0 30px rgba(0, 212, 255, 0.3);
            z-index: 100;
        }
        #info-panel h2 { margin: 0 0 10px 0; color: #00d4ff; font-size: 20px; font-weight: 300; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid rgba(0,212,255,0.3); padding-bottom: 5px; }
        
        /* Неоновый рисунок созвездия (сделали ярче) */
        #info-art-svg { height: 90px; width: 100%; margin-bottom: 12px; }
        
        #info-panel p { font-size: 14px; line-height: 1.6; margin: 0 0 12px 0; opacity: 0.9; }
        #info-history { font-size: 11px; line-height: 1.4; color: rgba(255,255,255,0.5); font-style: italic; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 10px; }

        .label { 
            position: absolute; font-size: 12px; color: #00d4ff;
            background: rgba(0, 30, 60, 0.7); border: 1px solid rgba(0, 212, 255, 0.5);
            padding: 4px 12px; border-radius: 20px; opacity: 0; transition: 0.4s;
            transform: translate(-50%, -50%); white-space: nowrap; pointer-events: none;
        }
        .label.visible { opacity: 1; }
    </style>
</head>
<body>
    <div id="labels"></div>
    <div id="info-panel">
        <svg id="info-art-svg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet"></svg>
        <h2 id="info-title">Созвездие</h2>
        <p id="info-text"></p>
        <div id="info-history"></div>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 30000);
        camera.position.set(0, 400, 1200); // Немного отдалили начальный вид, чтобы оценить масштаб

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const loader = new THREE.TextureLoader();
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        // ☀️ ТВОЕ СОЛНЦЕ (БЕЗ ИЗМЕНЕНИЙ)
        const sunGroup = new THREE.Group();
        const sunGeo = new THREE.SphereGeometry(90, 32, 32);
        const sunMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const sunMesh = new THREE.Mesh(sunGeo, sunMat);
        const glowGeo = new THREE.SphereGeometry(110, 32, 32);
        const glowMat = new THREE.MeshBasicMaterial({ color: 0xffdd44, transparent: true, opacity: 0.4, side: THREE.BackSide });
        sunGroup.add(sunMesh, new THREE.Mesh(glowGeo, glowMat));
        sunGroup.position.set(-1500, 600, -1800);
        scene.add(sunGroup);

        const sunLight = new THREE.PointLight(0xffffff, 10, 12000);
        sunLight.position.copy(sunGroup.position);
        scene.add(sunLight);
        scene.add(new THREE.AmbientLight(0xffffff, 0.2)); // Космический фон

        // 🌍 ЗЕМЛЯ (ТВОЙ "НЕ СИНИЙ" ВАРИАНТ)
        const earth = new THREE.Mesh(
            new THREE.SphereGeometry(80, 64, 64),
            new THREE.MeshStandardMaterial({
                map: loader.load('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg'),
                bumpMap: loader.load('https://unpkg.com/three-globe/example/img/earth-topology.png'),
                bumpScale: 3,
                color: 0xcccccc
            })
        );
        scene.add(earth);

        // 🔴 МАРС
        const mars = new THREE.Mesh(
            new THREE.SphereGeometry(40, 32, 32),
            new THREE.MeshStandardMaterial({ color: 0xd14b2b, roughness: 0.9 })
        );
        mars.position.set(600, 50, 400);
        scene.add(mars);

        // 🪐 САТУРН (С КОЛЬЦАМИ)
        const saturnGroup = new THREE.Group();
        const satBody = new THREE.Mesh(new THREE.SphereGeometry(60, 32, 32), new THREE.MeshStandardMaterial({ color: 0xe6dbad }));
        const ringGeo = new THREE.RingGeometry(80, 140, 64);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0xcfc0a3, side: THREE.DoubleSide, transparent: true, opacity: 0.7 });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.rotation.x = Math.PI / 2.2;
        saturnGroup.add(satBody, ring);
        saturnGroup.position.set(-800, -200, 800);
        scene.add(saturnGroup);

        // 🌌 КАТАЛОГ СОЗВЕЗДИЙ (РЕАЛЬНЫЕ КООРДИНАТЫ И РИСУНКИ)
        const constData = [
            { 
                name: "Кассиопея", 
                center: [400, 1000, 600],
                // Относительные координаты звезд (W-форма)
                stars: [[-100,50,0], [-50,-50,0], [0,50,0], [50,-50,0], [100,50,0]],
                // Как соединить звезды линиями (индексы)
                lines: [[0,1], [1,2], [2,3], [3,4]],
                desc: "Яркое созвездие, образующее букву W.", hist: "Мифическая царица.", 
                svg: '<polyline points="10,60 30,30 50,70 70,20 90,50" fill="none" stroke="#00d4ff" stroke-width="4" />' 
            },
            { 
                name: "Орион", 
                center: [-1000, -600, 1200],
                // Относительные координаты (Охотник)
                stars: [[-50,150,0], [50,130,0], [0,20,0], [-20,0,0], [20,-10,0], [-60,-130,0], [60,-150,0], [-40,220,0]],
                // Соединения (Пояс, Меч, Тело)
                lines: [[0,1], [1,4], [4,6], [6,5], [5,3], [3,0], [3,4], [2,3], [2,4], [0,7]],
                desc: "Великий охотник, экваториальное созвездие.", hist: "Помещен на небо после гибели от Скорпиона.", 
                svg: '<line x1="30" y1="20" x2="30" y2="80" stroke="#00d4ff" stroke-width="3"/><line x1="70" y1="20" x2="70" y2="80" stroke="#00d4ff" stroke-width="3"/><line x1="30" y1="50" x2="70" y2="50" stroke="#00d4ff" stroke-width="5"/>' 
            }
        ];

        const clickZones = [];
        const constellations = [];

        constData.forEach(data => {
            const group = new THREE.Group();
            group.position.set(...data.center);
            scene.add(group);

            // 1. Создаем звезды (Маленькие голубые сферы)
            const starMat = new THREE.MeshBasicMaterial({ color: 0x00d4ff });
            const starGeo = new THREE.SphereGeometry(8, 8, 8);
            data.stars.forEach(pos => {
                const star = new THREE.Mesh(starGeo, starMat);
                star.position.set(...pos);
                group.add(star);
            });

            // 2. Создаем точные линии (BufferGeometry)
            const points = data.stars.map(p => new THREE.Vector3(...p));
            const lineGeometry = new THREE.BufferGeometry();
            const lineIndices = [];
            data.lines.forEach(pair => lineIndices.push(pair[0], pair[1]));
            lineGeometry.setFromPoints(points);
            lineGeometry.setIndex(lineIndices);

            const lineMat = new THREE.LineBasicMaterial({ color: 0x00d4ff, transparent: true, opacity: 0.8, linewidth: 2 });
            const constLines = new THREE.LineSegments(lineGeometry, lineMat);
            group.add(constLines);

            // 3. Создаем этикетку
            const el = document.createElement('div');
            el.className = 'label'; el.textContent = data.name;
            document.getElementById('labels').appendChild(el);
            
            // 4. Невидимая зона для клика (оставили большой для Zenbook)
            const zone = new THREE.Mesh(new THREE.SphereGeometry(250, 16, 16), new THREE.MeshBasicMaterial({visible: false}));
            zone.position.copy(group.position);
            zone.userData = { ...data, element: el };
            scene.add(zone); clickZones.push(zone);

            constellations.push({ ...data, element: el, group: group });
        });

        // ✨ ЗВЕЗДЫ NASA STYLE (БЕЗ ИЗМЕНЕНИЙ)
        const starCoords = [];
        for(let i=0; i<15000; i++) starCoords.push((Math.random()-0.5)*18000, (Math.random()-0.5)*18000, (Math.random()-0.5)*18000);
        const starGeo = new THREE.BufferGeometry().setAttribute('position', new THREE.Float32BufferAttribute(starCoords, 3));
        scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({color: 0xffffff, size: 2.0})));

        // 🎮 УПРАВЛЕНИЕ (ВКЛЮЧИЛИ И УСКОРИЛИ ЗУМ)
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.enableZoom = true; // Теперь можно приближать!
        controls.zoomSpeed = 4.0;   // Сделали зум очень быстрым

        window.addEventListener('mousemove', (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const hits = raycaster.intersectObjects(clickZones);
            constellations.forEach(c => c.element.classList.remove('visible'));
            if(hits.length > 0) hits[0].object.userData.element.classList.add('visible');
        });

        window.addEventListener('click', () => {
            raycaster.setFromCamera(mouse, camera);
            const hits = raycaster.intersectObjects(clickZones);
            const panel = document.getElementById('info-panel');
            if(hits.length > 0) {
                const d = hits[0].object.userData;
                document.getElementById('info-title').textContent = d.name;
                document.getElementById('info-text').textContent = d.desc;
                document.getElementById('info-history').textContent = d.hist;
                document.getElementById('info-art-svg').innerHTML = d.svg;
                panel.style.display = 'block';
            } else { panel.style.display = 'none'; }
        });

        function animate() {
            requestAnimationFrame(animate);
            earth.rotation.y += 0.001;
            mars.rotation.y += 0.002;
            saturnGroup.rotation.y += 0.0005;

            constellations.forEach(c => {
                const v = new THREE.Vector3(...c.center).project(camera);
                c.element.style.left = `${(v.x * .5 + .5) * window.innerWidth}px`;
                c.element.style.top = `${(v.y * -.5 + .5) * window.innerHeight}px`;
            });

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
